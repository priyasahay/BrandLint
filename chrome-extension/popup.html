<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrandLint</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="header">
    <span class="logo-icon">
      <svg viewBox="0 0 20 20" width="14" height="14" fill="none">
        <circle cx="8" cy="8" r="5.5" stroke="white" stroke-width="1.8"/>
        <path d="M5.5 8 L7.5 10 L11 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="12.3" y1="12.3" x2="17.5" y2="17.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="logo-name">BrandLint</span>
  </div>

  <div class="url-row">
    <span class="url-label">Current page</span>
    <span id="current-url" class="current-url">Loading...</span>
  </div>

  <button id="analyze-btn" class="analyze-btn">
    <span id="btn-text">Analyze this page</span>
  </button>

  <div id="result" class="result hidden"></div>
  <div id="error-msg" class="error-msg hidden"></div>

  <a id="open-link" class="open-link hidden" href="#" target="_blank">
    View full report in BrandLint →
  </a>

  <script src="popup.js"></script>
</body>
</html>
