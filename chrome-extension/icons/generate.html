<!DOCTYPE html>
<html>
<head>
  <title>BrandLint — Generate Icons</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 32px; background: #030309; color: #f0f2ff; }
    h2 { margin-bottom: 6px; }
    p { color: #8b90b8; margin-bottom: 24px; font-size: 14px; }
    .previews { display: flex; gap: 32px; align-items: flex-end; margin-bottom: 24px; }
    .icon-wrap { text-align: center; }
    .icon-wrap img { display: block; margin: 0 auto 10px; image-rendering: pixelated; border: 1px solid #2a2a3e; border-radius: 4px; }
    .icon-wrap span { display: block; font-size: 12px; color: #8b90b8; margin-bottom: 8px; }
    a.dl {
      display: inline-block; padding: 7px 16px;
      background: linear-gradient(135deg, #7c3aed, #0ea5e9);
      color: white; border-radius: 8px; text-decoration: none;
      font-size: 13px; font-weight: 600;
    }
    .note { background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); border-radius: 10px; padding: 14px 18px; font-size: 13px; color: #a78bfa; max-width: 520px; line-height: 1.6; }
    code { background: #1a1a2e; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <h2>BrandLint Icon Generator</h2>
  <p>Download each icon, then place them inside the <code>chrome-extension/icons/</code> folder.</p>
  <div class="previews" id="previews"></div>
  <div class="note">
    After saving all 3 icons, reload the extension at <code>chrome://extensions</code> to see the new logo.
  </div>

  <script>
    function drawIcon(size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Rounded rectangle background
      const r = size * 0.22;
      ctx.beginPath();
      ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
      ctx.arcTo(size, 0, size, r, r);
      ctx.lineTo(size, size - r);
      ctx.arcTo(size, size, size - r, size, r);
      ctx.lineTo(r, size);
      ctx.arcTo(0, size, 0, size - r, r);
      ctx.lineTo(0, r);
      ctx.arcTo(0, 0, r, 0, r);
      ctx.closePath();

      const bg = ctx.createLinearGradient(0, 0, size, size);
      bg.addColorStop(0, '#7c3aed');
      bg.addColorStop(1, '#0ea5e9');
      ctx.fillStyle = bg;
      ctx.fill();

      // Magnifying glass logo (white)
      const cx = size / 2, cy = size / 2;
      const glassX = cx - size * 0.08;
      const glassY = cy - size * 0.08;
      const glassR = size * 0.28;
      const lw = Math.max(1, size * 0.065);

      ctx.strokeStyle = 'white';
      ctx.fillStyle = 'white';
      ctx.lineWidth = lw;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // Magnifying glass circle
      ctx.beginPath();
      ctx.arc(glassX, glassY, glassR, 0, Math.PI * 2);
      ctx.stroke();

      // Checkmark inside
      const ck = glassR * 0.52;
      ctx.beginPath();
      ctx.moveTo(glassX - ck * 0.7, glassY);
      ctx.lineTo(glassX - ck * 0.05, glassY + ck * 0.65);
      ctx.lineTo(glassX + ck * 0.85, glassY - ck * 0.55);
      ctx.stroke();

      // Handle (bottom-right)
      const angle = Math.PI * 0.25;
      ctx.lineWidth = lw * 1.3;
      ctx.beginPath();
      ctx.moveTo(glassX + Math.cos(angle) * (glassR + size * 0.02), glassY + Math.sin(angle) * (glassR + size * 0.02));
      ctx.lineTo(glassX + Math.cos(angle) * size * 0.46, glassY + Math.sin(angle) * size * 0.46);
      ctx.stroke();

      return canvas;
    }

    [16, 48, 128].forEach(size => {
      const canvas = drawIcon(size);
      const url = canvas.toDataURL('image/png');

      const img = document.createElement('img');
      img.src = url;
      img.width = Math.max(size, 48);
      img.height = Math.max(size, 48);
      img.style.width = Math.max(size, 48) + 'px';
      img.style.height = Math.max(size, 48) + 'px';

      const a = document.createElement('a');
      a.href = url;
      a.download = `icon${size}.png`;
      a.className = 'dl';
      a.textContent = `↓ icon${size}.png`;

      const wrap = document.createElement('div');
      wrap.className = 'icon-wrap';
      const label = document.createElement('span');
      label.textContent = `${size}×${size}`;
      wrap.appendChild(img);
      wrap.appendChild(label);
      wrap.appendChild(a);
      document.getElementById('previews').appendChild(wrap);
    });
  </script>
</body>
</html>
